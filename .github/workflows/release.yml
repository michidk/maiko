# @orcastrate
# template: projects/maiko/release
# @end-orcastrate

name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test release artifacts without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release version and source
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$DRY_RUN" == true ]]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          else
            [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Select a stable vX.Y.Z tag.'; exit 1; }
            version="${GITHUB_REF_NAME#v}"
          fi
          for manifest in Cargo.toml patcher/Cargo.toml runtime/host/Cargo.toml runtime/glide/Cargo.toml; do
            actual=$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' "$manifest")
            test "$actual" = "$version"
          done
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
  kits:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kits
      - name: Install Wasmtime
        run: |
          archive=wasmtime-v37.0.3-x86_64-linux.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/bytecodealliance/wasmtime/releases/download/v37.0.3/$archive"
          echo "0107351ed1f2c141c4069b110cff5fdb937d73cdcb29e3ecf66ed967717fdf5a  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v37.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: Fetch the original executable
        # RGFX_EXE_URL is a private download link for your own copy of RGFX.EXE. The build checks its SHA-256.
        env:
          RGFX_EXE_URL: ${{ secrets.RGFX_EXE_URL }}
        run: |
          [[ -n "$RGFX_EXE_URL" ]] || { echo '::error::Set the RGFX_EXE_URL secret to a private link for the original RGFX.EXE.'; exit 1; }
          echo "::add-mask::$RGFX_EXE_URL"
          curl -fsSL -o "$RUNNER_TEMP/RGFX.EXE" "$RGFX_EXE_URL"
      - name: Build, export and verify the runtime kits
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: python3 -m tools.release_kits --exe "$RUNNER_TEMP/RGFX.EXE" --output "$RUNNER_TEMP/kits" --tag "$TAG"
      - name: Remove the original executable
        if: always()
        run: rm -f "$RUNNER_TEMP/RGFX.EXE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kits
          path: ${{ runner.temp }}/kits
          if-no-files-found: error
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
  web:
    needs: [version, kits]
    uses: ./.github/workflows/web.yml
    with:
      pages_artifact: false
      kits_artifact: kits
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            executable: maiko-patcher
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable: maiko-patcher.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and test standalone patcher
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo test -p maiko-patcher --locked --target "$TARGET"
          cargo build -p maiko-patcher --bin maiko-patcher --release --locked --target "$TARGET"
          mkdir package
          cp "target/$TARGET/release/$EXECUTABLE" package/
          cp LICENSE docs/client-builder.md package/
          tar -czf "maiko-patcher-$PLATFORM.tar.gz" -C package .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: patcher-${{ matrix.platform }}
          path: maiko-patcher-*.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [version, verify, web, native, kits]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: patcher-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser
          path: release
      - name: Collect exactly the verified support kits
        run: |
          mkdir browser
          tar -xzf release/maiko-browser.tar.gz -C browser
          cp browser/kits/linux.zip release/maiko-runtime-kit-linux.zip
          cp browser/kits/windows.zip release/maiko-runtime-kit-windows.zip
          cp LICENSE release/LICENSE
          cp docs/client-builder.md release/README.md
          cd release
          sha256sum maiko-* LICENSE README.md > SHA256SUMS
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header --output release-notes.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-state; then
            if [[ $(cat draft-state) != true ]]; then
              echo 'Release already published; keeping existing assets.'
            else
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --draft=false --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "Maiko $TAG" --notes-file release-notes.md
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --draft=false --notes-file release-notes.md
          fi
      - name: Prepare the published browser for deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir published published-site
          gh release download "$TAG" --pattern maiko-browser.tar.gz --pattern SHA256SUMS --dir published
          (cd published && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf published/maiko-browser.tar.gz -C published-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: published-site
  pin-kits:
    # Later builds from main use these kits until the next release replaces them.
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kits
          path: kits
      - name: Publish the signed kit pins
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # macOS keeps its own pin; only the kits built for this tag change.
          jq -S . kits/kits.json > "$RUNNER_TEMP/new.json"
          jq -S . web/kits.json > "$RUNNER_TEMP/old.json"
          if cmp -s "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/old.json"; then echo 'Pins already current.'; exit 0; fi
          cp kits/kits.json web/kits.json
          head=$(git rev-parse HEAD)
          content=$(base64 -w0 web/kits.json)
          body=$'Co-authored-by: Michael Lohr <michael@lohr.dev>\nCo-authored-by: Claude <noreply@anthropic.com>'
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg head "$head" --arg title "chore(release): pin runtime kits for $TAG" --arg body "$body" --arg contents "$content" \
            '{query:"mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",variables:{input:{branch:{repositoryNameWithOwner:$repository,branchName:"main"},expectedHeadOid:$head,message:{headline:$title,body:$body},fileChanges:{additions:[{path:"web/kits.json",contents:$contents}]}}}}' > "$RUNNER_TEMP/commit.json"
          oid=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid')
          [[ "$oid" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$oid" --jq '.commit.verification.verified' | grep -qx true
  deploy:
    needs: [publish, web]
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
