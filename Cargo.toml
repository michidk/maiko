[workspace]
members = ["crates/runtime", "crates/runtime/host", "crates/runtime/glide", "crates/patcher", "crates/launcher"]
default-members = ["crates/runtime"]
resolver = "3"

[profile.release]
panic = "abort"

# The game runtime that players download (tools/rust_runtime.py): small files, one codegen unit with
# link-time optimisation and no symbol tables or debug sections in the Rust objects.
[profile.runtime]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
