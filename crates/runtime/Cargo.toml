[package]
name = "maiko-runtime"
version = "1.0.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "rust/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
llasm = []

[dependencies]
maiko-launcher = { path = "../launcher", default-features = false }
winit = "=0.30.13"
gilrs = "=0.11.2"
cpal = "=0.16.0"
raw-window-handle = "=0.6.2"
libc = "=0.2.191"
linked_list_allocator = { version = "=0.10.6", default-features = false }
cap-std = "=3.4.5"
cap-fs-ext = "=3.4.5"
sha2 = "=0.11.1"
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.36.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_WindowsProgramming", "Win32_System_Kernel", "Win32_System_Console", "Win32_System_IO", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[dev-dependencies]
tempfile = "=3.23.0"
