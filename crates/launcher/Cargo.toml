[package]
name = "maiko-launcher"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# The library (finding the game folder, reading the original launcher's artwork) is shared with the
# game runtime; the window is the `app` feature so the runtime does not pull in the launcher's UI.
[features]
default = ["app"]
app = ["dep:winit", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:wgpu", "dep:pollster", "dep:rodio", "dep:rfd", "dep:open", "dep:sysinfo", "dep:zip"]

[lib]
# The packages link the static library with a small C `main`.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "maiko"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "=0.30.13", optional = true }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"], optional = true }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"], optional = true }
egui-wgpu = { version = "=0.36.2", default-features = false, optional = true }
# The game's renderer (rustyglide) uses the same wgpu and backends.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"], optional = true }
pollster = { version = "0.4", optional = true }
rfd = { version = "=0.18.0", optional = true }
open = { version = "=5.4.5", optional = true }
sysinfo = { version = "=0.40.3", default-features = false, features = ["system"], optional = true }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "hound"], optional = true }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }


[dev-dependencies]
tempfile = "=3.23.0"
