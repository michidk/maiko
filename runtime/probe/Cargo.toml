[package]
name = "maiko-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Kernel"] }
