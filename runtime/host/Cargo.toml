[package]
name = "maiko-host"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false

[features]
llasm = ["maiko-runtime/llasm", "maiko-glide/llasm"]
llasm-entry = ["llasm"]

[dependencies]
maiko-runtime = { path = "../.." }
maiko-glide = { path = "../glide" }
