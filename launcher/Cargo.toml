[package]
name = "maiko-launcher"
version = "0.4.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

# The library (finding the game folder, reading the original launcher's artwork) is shared with the
# game runtime; the window is the `app` feature so the runtime does not pull in the launcher's UI.
[features]
default = ["app"]
app = ["dep:sdl2", "dep:egui", "dep:egui_glow", "dep:glow", "dep:zip"]

[lib]
# The packages link the static library with a C `main`, against the SDL they ship.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "maiko"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl2 = { version = "=0.38.0", default-features = false, features = ["mixer"], optional = true }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"], optional = true }
egui_glow = { version = "=0.33.3", default-features = false, optional = true }
glow = { version = "=0.16.0", optional = true }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.23.0"
